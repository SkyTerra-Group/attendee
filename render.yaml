# =============================================================================
# Render Blueprint — Self-hosted Attendee meeting bot (for SkyTerra engagement-agent)
# =============================================================================
#
# WHAT THIS IS
#   A TEMPLATE Render Blueprint that stands up the open-source Attendee meeting
#   bot (https://github.com/attendee-labs/attendee) on Render. Attendee is free
#   open-source SOFTWARE; the Render INFRASTRUCTURE it runs on is paid
#   (~$48-108/mo — see docs/self-host-attendee-runbook.md). This is NOT a free
#   deployment: Render does not offer Free-tier background workers, and Attendee
#   requires a Celery worker to actually run bots.
#
# HOW TO USE
#   Attendee publishes NO prebuilt Docker image (no GHCR/Docker Hub) and NO
#   upstream render.yaml — verified against the repo on 2026-06-23. Render must
#   BUILD from the Dockerfile. The repo:/branch: keys below point the build at
#   upstream attendee-labs/attendee (public, so Render can build it) while this
#   Blueprint file lives in your fork. Pin branch: to a SHA/tag for reproducibility.
#
# CONNECTION-VAR FIX (2026-06-23): DATABASE_URL (fromDatabase) and REDIS_URL
#   (fromService) live in EACH SERVICE's envVars, NOT in the shared envVarGroup —
#   Render rejects fromDatabase/fromService inside envVarGroups ("must have a key
#   and value"). Literal/generated/sync:false vars stay in the shared group.
#
# SOURCE OF TRUTH for every value below (verified 2026-06-23):
#   - web/worker commands ............ Procfile (web: gunicorn attendee.wsgi /
#                                        worker: celery -A attendee worker -l info)
#   - prod settings module ........... attendee/settings/production.py
#   - DATABASE_URL (NOT POSTGRES_*) .. attendee/settings/production.py reads it via
#                                        dj_database_url.config(env="DATABASE_URL")
#   - REDIS_URL ...................... attendee/settings/base.py (Celery broker)
#   - DJANGO_SECRET_KEY / CREDENTIALS_ENCRYPTION_KEY ... attendee/settings/base.py
#   - SITE_DOMAIN .................... attendee/settings/base.py (default
#                                        "app.attendee.dev" — MUST be overridden)
#   - LAUNCH_ADHOC_BOTS_ASYNC ........ attendee/settings/base.py
#   - ENABLE_CHROME_SANDBOX=false .... dev.docker-compose.yaml (worker setting)
#   - healthCheckPath /health/ ....... attendee/urls.py
#
# NOT INCLUDED ON PURPOSE (add only when the operator opts in):
#   - AWS S3 (recordings), Deepgram/OpenAI STT keys (captions are $0), Zoom creds
#     (Meet+Teams need none), the webpage-streamer + scheduler services.
# =============================================================================

databases:
  - name: attendee-postgres
    # Render Postgres. basic-256mb is the cheapest persistent paid tier (~$6/mo).
    # Do NOT use the Free tier: Free Postgres expires after 30 days.
    plan: basic-256mb

services:
  # ---------------------------------------------------------------------------
  # Web (Django/Gunicorn) — serves the Attendee dashboard + REST API
  # ---------------------------------------------------------------------------
  - name: attendee-web
    type: web
    runtime: docker
    repo: https://github.com/attendee-labs/attendee   # build from upstream (public)
    branch: main                                       # TODO: pin to a known-good SHA/tag
    plan: starter                                      # web is light; starter ($7/mo)
    region: oregon                                     # TODO: closest region to you
    healthCheckPath: /health/                          # attendee/urls.py
    # Render runs these as BARE ARGV — no shell, so no &&, no quotes, no $VAR expansion
    # (verified: both `a && b` and `sh -c "..."` failed 2026-06-23). Keep them single
    # commands: migrate only in pre-deploy (run collectstatic once via the web shell),
    # hardcoded port (PORT=10000 env below; Render also auto-detects the listening port).
    dockerCommand: gunicorn attendee.wsgi:application --bind 0.0.0.0:10000
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - fromGroup: attendee-shared
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: attendee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: attendee-redis
          property: connectionString

  # ---------------------------------------------------------------------------
  # Worker (Celery) — runs the browser meeting bots AND delivers webhooks
  # ---------------------------------------------------------------------------
  # Runs full Chrome + Xvfb + PulseAudio + ffmpeg per bot. Start at `standard`
  # (1 CPU / 2 GiB, ~$25/mo); bump to `pro` (2 CPU / 4 GiB) if bots OOM.
  - name: attendee-worker
    type: worker
    runtime: docker
    repo: https://github.com/attendee-labs/attendee   # must match attendee-web
    branch: main                                       # keep in sync with attendee-web
    plan: standard                                     # TODO: bump to `pro` if bots OOM
    region: oregon                                     # must match attendee-web region
    dockerCommand: celery -A attendee worker -l info --concurrency=1
    envVars:
      - fromGroup: attendee-shared
      - key: ENABLE_CHROME_SANDBOX
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: attendee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: attendee-redis
          property: connectionString

  # ---------------------------------------------------------------------------
  # Key Value (Redis) — Celery broker + result backend
  # ---------------------------------------------------------------------------
  - name: attendee-redis
    type: keyvalue
    plan: starter            # Free Key Value loses the queue on restart
    region: oregon           # must match the web/worker region
    ipAllowList: []          # [] = internal connections ONLY
    maxmemoryPolicy: noeviction   # never evict queued Celery jobs

# =============================================================================
# Shared environment (literal / generated / operator-supplied vars only).
# fromDatabase / fromService are NOT allowed here — they are per-service above.
# =============================================================================
envVarGroups:
  - name: attendee-shared
    envVars:
      # --- Django / boot (Found: production.py, base.py) ---
      - key: DJANGO_SETTINGS_MODULE
        value: attendee.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true        # opaque random secret — Render-generated is fine
      # CREDENTIALS_ENCRYPTION_KEY MUST be a Fernet key (init_env.py uses
      # Fernet.generate_key()). Render generateValue is base64 but NOT guaranteed
      # Fernet-shaped, so paste your own:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false                # operator pastes the Fernet key at create time
      - key: POSTGRES_SSL_REQUIRE
        value: "true"              # production.py default; Render Postgres uses SSL

      # --- Site / URL identity (Found: base.py SITE_DOMAIN default app.attendee.dev) ---
      # Set to the attendee-web Render hostname WITHOUT scheme after first deploy.
      - key: SITE_DOMAIN
        sync: false

      # --- Bootstrap / behavior (Found: production.py, base.py, launch_bot_utils.py) ---
      - key: DISABLE_EMAIL
        value: "true"              # console-only email; read the signup link from web logs
      - key: DISABLE_SIGNUP
        value: "false"             # TODO(operator): flip to "true" AFTER first account
      - key: LAUNCH_ADHOC_BOTS_ASYNC
        value: "true"              # run bots in the worker, not inline in the web request
      # LAUNCH_BOT_METHOD intentionally NOT set -> Attendee uses the Celery path.
